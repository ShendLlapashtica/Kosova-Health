<!doctype html><html><head><meta charset="utf-8">
<!-- Source of public/og-image.png (LinkedIn/WhatsApp link preview, 1200x627). Open in Chrome at 1200x627 and screenshot to update. -->
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=block" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; }
  body { width: 1200px; height: 627px; font-family: Inter, sans-serif; background: #faf8ff; color: #131b2e; overflow: hidden; position: relative; }
  .glow { position: absolute; right: -160px; top: -160px; width: 620px; height: 620px; border-radius: 50%; background: radial-gradient(circle, rgba(0,131,120,.18), rgba(0,131,120,0) 70%); }
  .wrap { position: absolute; inset: 0; padding: 60px 72px 100px; display: flex; flex-direction: column; justify-content: space-between; }
  .brand { display: flex; align-items: center; gap: 18px; }
  .brand img { width: 72px; height: 72px; border-radius: 18px; }
  .brand span { font-size: 40px; font-weight: 800; color: #00685f; letter-spacing: -0.5px; }
  .badge { position: absolute; right: 72px; top: 72px; background: #00685f; color: #fff; font-weight: 700; font-size: 24px; padding: 12px 22px; border-radius: 999px; box-shadow: 0 6px 18px rgba(0,104,95,.25); }
  h1 { font-size: 58px; line-height: 1.08; font-weight: 800; letter-spacing: -1.2px; max-width: 980px; }
  h1 em { font-style: normal; color: #00685f; }
  .chips { display: flex; gap: 14px; flex-wrap: wrap; }
  .chip { background: #fff; border: 2px solid #d5e3e0; border-radius: 16px; padding: 14px 20px; font-size: 24px; font-weight: 600; }
  .chip b { color: #00685f; }
  .url { position: absolute; left: 74px; bottom: 44px; font-size: 22px; font-weight: 600; color: #5b6b69; }
</style></head><body>
<div class="glow"></div>
<div class="badge">🥈 2nd place · AI For Kosovo</div>
<div class="wrap">
  <div class="brand"><img src="../public/logo-mark.png" alt=""><span>KosovaHealth</span></div>
  <h1>Your blood test in plain words — and the <em>foods you can safely buy</em> in Kosovo.</h1>
  <div class="chips">
    <div class="chip">🩸 Lab PDF → <b>plain words</b></div>
    <div class="chip">🛒 <b>14,332</b> products · <b>38</b> shops</div>
    <div class="chip">💊 <b>137</b> pharmacies</div>
  </div>
</div>
<div class="url">kosova-health.vercel.app</div>
</body></html>
